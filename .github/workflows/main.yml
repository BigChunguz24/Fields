# This workflow will install Python dependencies, run tests and lint with a single version of Python

name: CI/CD Master Branch

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13 dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-testrun.txt

      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-testrun.txt

      - name: Check formatting with Black
        run: python -m black --check .

      - name: Lint with Flake8 (e.g. syntax errors)
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: python -m pytest -v


  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      # Output deploy tag
      deploy_tag: ${{ steps.docker_image.outputs.deploy_tag }}

    steps:
    - uses: actions/checkout@v4

    - name: Create docker image
      id: docker_image
      # Build docker image only on push to main
      if: (github.event_name == 'push' && github.event.ref == 'refs/heads/main')
      run: |
        export GA_DOCKER_TAGS=latest
        export GA_DEPLOY_TAG=latest

        # If it's push to main, then use the git commit sha as the Docker tag
        if [[ ${GITHUB_REF} =~ ^refs/heads/ ]] ; then
          export GA_DEPLOY_TAG="$( echo "sha-${GITHUB_SHA:0:7}" )" ;
          export GA_DOCKER_TAGS="latest ${GA_DEPLOY_TAG}" ;
        fi
        echo "Using tags: ${GA_DOCKER_TAGS}"
        echo "Deploy tag: ${GA_DEPLOY_TAG}"

        # Login to docker registry
        echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u ${{ secrets.DOCKER_REPO_USER }} --password-stdin docker.io
        
        # Login to GitHub
        echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        # Build and push image
        bash scripts/build_docker.sh "${GA_DOCKER_TAGS}"

        # create output for other jobs
        echo "deploy_tag=$GA_DEPLOY_TAG" >> $GITHUB_OUTPUT

